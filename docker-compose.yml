services:
  hfbrasil-preco:
    build: .
    image: hfbrasil-preco:latest
    # A imagem e construida localmente (build acima), nunca baixada de um
    # registro. 'build' faz o Compose SEMPRE construir no deploy e NAO tentar
    # dar pull — sem isso o "Pull and redeploy" do Portainer falha com
    # "pull access denied for hfbrasil-preco" (a imagem nao existe em registro).
    pull_policy: build
    container_name: hfbrasil-preco
    environment:
      # ── Fuso (o agendamento de segunda 07:00 segue este TZ) ──
      - TZ=America/Sao_Paulo
      # ── Banco (prefixo PG_) — SEM a senha aqui ──
      - PG_HOST=192.168.0.250
      - PG_PORT=5432
      - PG_DBNAME=FABRICA
      - PG_USER=postgres
      - PG_SCHEMA=hfbrasil_preco
      # Senha: definida como variavel de ambiente da STACK no Portainer
      # (nao vai para o git). Local dev le do .env automaticamente.
      - PG_PASSWORD=${PG_PASSWORD:?defina a variavel PG_PASSWORD na stack do Portainer}
      # ── Pipeline ──
      - BASE_DIR=/app/dados
      - PERIODICIDADE=Diario
      - HEADLESS=true
      - CANAL=console
      # RUN_ON_START=true executa o pipeline uma vez ao subir o container
      # (valide o deploy e depois volte para false).
      - RUN_ON_START=false
    volumes:
      # Persiste XLSX/CSV/logs entre reinicios e recriacoes do container.
      - hfbrasil_dados:/app/dados
    restart: unless-stopped

volumes:
  hfbrasil_dados: